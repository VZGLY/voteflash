server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pas de cache aggressif sur l'app statique pendant le dev
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend (service 'backend' du docker-compose / K8S)
    # Le slash final sur proxy_pass strip le prefixe /api/ :
    #   /api/polls  ->  http://backend:3000/polls
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITIQUE pour SSE : pas de buffering, pas de gzip, timeout long
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }
}
